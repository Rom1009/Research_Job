services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research_job_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: research_job
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d research_job"]
      interval: 5s
      timeout: 3s
      retries: 5
      
volumes:
  postgres_data: